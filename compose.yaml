services:
  loomi:
    build: ./self-hosted
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-owner@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      COOKIE_SECURE: "false"
    volumes:
      - loomi_data:/app/data
      - /var/lib/loomi/backup-status:/run/loomi-backups:ro
    secrets:
      - admin_password
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
secrets:
  admin_password:
    file: ./self-hosted/secrets/admin_password
volumes:
  loomi_data:
