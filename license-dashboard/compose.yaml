services:
  licence-desk:
    build: .
    image: bitwise-licence-desk:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    environment:
      APP_URL: ${APP_URL:?Set the private HTTPS dashboard URL}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set the Bitwise super-admin email}
    secrets:
      - admin_password
      - signing_key
    volumes:
      - issuer_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  admin_password:
    file: ./secrets/admin_password
  signing_key:
    file: ./secrets/signing_key
volumes:
  issuer_data:
